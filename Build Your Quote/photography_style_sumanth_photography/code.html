<!-- Back Button -->

                BACK
            </button>
<!-- Continue Button (Disabled by default) -->
<button class="bg-surface-variant text-on-surface-variant px-gutter py-unit flex items-center justify-center font-label-sm text-label-sm uppercase tracking-widest cursor-not-allowed transition-colors duration-200 h-[48px]" disabled="" id="continueBtn">
                CONTINUE <span class="ml-2 font-normal">→</span>
</button>
</div>
</footer>
<script>
        function selectCard(clickedCard) {
            // Remove selected class from all cards
            const cards = document.querySelectorAll('.selection-card');
            cards.forEach(card => card.classList.remove('selected'));
            
            // Add selected class to clicked card
            clickedCard.classList.add('selected');

            // Enable continue button
            const continueBtn = document.getElementById('continueBtn');
            continueBtn.disabled = false;
            continueBtn.className = "bg-primary text-on-primary px-gutter py-unit flex items-center justify-center font-label-sm text-label-sm uppercase tracking-widest hover:bg-tertiary-container transition-colors duration-200 h-[48px] cursor-pointer";
        }
    </script>

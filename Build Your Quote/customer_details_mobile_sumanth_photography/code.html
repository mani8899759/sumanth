<style>
        /* Editorial Minimalism Custom Checkbox */
        .editorial-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid theme('colors.primary');
            background-color: transparent;
            display: grid;
            place-content: center;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .editorial-checkbox::before {
            content: "✕";
            font-family: "Inter", sans-serif;
            font-size: 0.8rem;
            font-weight: 300;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            color: theme('colors.on-primary');
        }
        .editorial-checkbox:checked {
            background-color: theme('colors.primary');
        }
        .editorial-checkbox:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-surface text-primary min-h-screen flex flex-col font-body-md text-body-md antialiased pb-32">
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile pt-16 md:pt-24">
<!-- Header -->
<header class="mb-12 border-b border-primary pb-6">
<div class="flex flex-col gap-2">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Step 05 / 05</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase">Almost There</h1>
</div>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-10">
<!-- Bento-style grid for inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-10">
<div class="flex flex-col gap-2 col-span-1 md:col-span-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="fullName">Full Name</label>
<input class="w-full bg-transparent border-0 border-b border-primary py-3 px-0 focus:ring-0 focus:border-b-2 font-body-lg text-body-lg text-primary placeholder:text-surface-dim transition-all rounded-none" id="fullName" name="fullName" placeholder="First and Last Name" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="phone">Phone</label>
<input class="w-full bg-transparent border-0 border-b border-primary py-3 px-0 focus:ring-0 focus:border-b-2 font-body-lg text-body-lg text-primary placeholder:text-surface-dim transition-all rounded-none" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="email">Email</label>
<input class="w-full bg-transparent border-0 border-b border-primary py-3 px-0 focus:ring-0 focus:border-b-2 font-body-lg text-body-lg text-primary placeholder:text-surface-dim transition-all rounded-none" id="email" name="email" placeholder="hello@example.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="date">Event Date</label>
<input class="w-full bg-transparent border-0 border-b border-primary py-3 px-0 focus:ring-0 focus:border-b-2 font-body-lg text-body-lg text-primary placeholder:text-surface-dim transition-all rounded-none" id="date" name="date" type="date"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="city">City</label>
<input class="w-full bg-transparent border-0 border-b border-primary py-3 px-0 focus:ring-0 focus:border-b-2 font-body-lg text-body-lg text-primary placeholder:text-surface-dim transition-all rounded-none" id="city" name="city" placeholder="e.g. New York, Paris" type="text"/>
</div>
<div class="flex flex-col gap-2 col-span-1 md:col-span-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="venue">Venue (If Known)</label>
<input class="w-full bg-transparent border-0 border-b border-primary py-3 px-0 focus:ring-0 focus:border-b-2 font-body-lg text-body-lg text-primary placeholder:text-surface-dim transition-all rounded-none" id="venue" name="venue" placeholder="Name of location" type="text"/>
</div>
<div class="flex flex-col gap-2 col-span-1 md:col-span-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="notes">Additional Notes</label>
<textarea class="w-full bg-transparent border-0 border-b border-primary py-3 px-0 focus:ring-0 focus:border-b-2 font-body-lg text-body-lg text-primary placeholder:text-surface-dim transition-all resize-none rounded-none" id="notes" name="notes" placeholder="Tell us more about your vision..." rows="4"></textarea>
</div>
</div>
<!-- Terms -->
<div class="mt-8 flex items-start gap-4 p-6 border border-primary bg-surface-bright">
<input class="editorial-checkbox mt-1" id="terms" name="terms" required="" type="checkbox"/>
<label class="font-body-md text-body-md text-secondary cursor-pointer leading-relaxed" for="terms">
                    I agree to the terms of service and understand this inquiry does not guarantee a booking until a contract is signed and retainer is paid.
                </label>
</div>
</form>
</main>
<!-- BottomNavBar (Generated from JSON specification) -->
<!-- Applying exact styles from JSON execution mandates -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-desktop py-6 bg-surface dark:bg-surface border-t border-tertiary">
<!-- Inactive State (Back) -->
<button class="flex items-center gap-2 text-primary border border-primary px-8 py-4 rounded-none hover:bg-tertiary hover:text-on-tertiary transition-all duration-200 active:scale-95 transition-transform font-label-sm text-label-sm uppercase tracking-widest">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
            Back
        </button>
<!-- Active State (Request My Quote) -->
<button class="flex items-center gap-2 bg-primary text-on-primary px-8 py-4 rounded-none hover:bg-tertiary hover:text-on-tertiary transition-all duration-200 active:scale-95 transition-transform font-label-sm text-label-sm uppercase tracking-widest">
            Request My Quote
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</nav>

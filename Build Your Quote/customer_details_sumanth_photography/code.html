<style>
        /* Custom styles for minimalist inputs and editorial feel */
        .editorial-input {
            border: none;
            border-bottom: 1px solid theme('colors.tertiary');
            background-color: transparent;
            border-radius: 0;
            padding: theme('spacing.2') 0;
            box-shadow: none !important;
            transition: border-color 0.3s ease;
        }
        .editorial-input:focus {
            outline: none;
            border-bottom-color: theme('colors.primary');
            border-bottom-width: 2px;
        }
        .editorial-input::placeholder {
            color: theme('colors.outline-variant');
        }
        
        /* Custom Checkbox */
        .custom-checkbox input:checked + div {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }
        .custom-checkbox input:checked + div .check-icon {
            opacity: 1;
        }
        
        /* Noise texture for paper feel */
        .bg-noise {
            position: relative;
        }
        .bg-noise::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.02;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");

<p class="font-body-lg text-body-lg text-secondary">Tell us a little about the day we're helping you document.</p>

<!-- Form -->
<form class="max-w-4xl w-full" id="customer-details-form">
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-12">
<!-- Full Name -->
<div class="relative flex flex-col pt-6">
<label class="absolute top-0 left-0 font-label-sm text-label-sm uppercase tracking-widest text-secondary" for="fullName">Full Name *</label>
<input class="editorial-input font-body-md text-body-md text-primary w-full" id="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Phone Number -->
<div class="relative flex flex-col pt-6">
<label class="absolute top-0 left-0 font-label-sm text-label-sm uppercase tracking-widest text-secondary" for="phone">Phone Number *</label>
<input class="editorial-input font-body-md text-body-md text-primary w-full" id="phone" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
<!-- Email Address -->
<div class="relative flex flex-col pt-6">
<label class="absolute top-0 left-0 font-label-sm text-label-sm uppercase tracking-widest text-secondary" for="email">Email Address *</label>
<input class="editorial-input font-body-md text-body-md text-primary w-full" id="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<!-- Wedding Date -->
<div class="relative flex flex-col pt-6">
<label class="absolute top-0 left-0 font-label-sm text-label-sm uppercase tracking-widest text-secondary" for="date">Wedding Date *</label>
<input class="editorial-input font-body-md text-body-md text-primary w-full" id="date" required="" type="date"/>
</div>

</div>

<label class="absolute top-0 left-0 font-label-sm text-label-sm uppercase tracking-widest text-secondary" for="city">City (Optional)</label>
<input class="editorial-input font-body-md text-body-md text-primary w-full" id="city" placeholder="New York, NY" type="text"/>
</div>

</div>

<span class="font-label-sm text-label-sm uppercase tracking-widest">Request My Quote</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">arrow_forward</span>
</button>

<!-- Form Validation Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('customer-details-form');
            const submitBtn = document.getElementById('submitBtn');
            const requiredInputs = form.querySelectorAll('[required]');

            function checkFormValidity() {
                let isValid = true;
                requiredInputs.forEach(input => {
                    if (!input.value.trim() || (input.type === 'checkbox' && !input.checked)) {
                        isValid = false;
                    }
                });

                if (isValid) {
                    // Enable Button
                    submitBtn.removeAttribute('disabled');
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.add('hover:bg-tertiary', 'active:scale-95');
                } else {
                    // Disable Button
                    submitBtn.setAttribute('disabled', 'true');
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.remove('hover:bg-tertiary', 'active:scale-95');
                }
            }

            requiredInputs.forEach(input => {
                input.addEventListener('input', checkFormValidity);
                input.addEventListener('change', checkFormValidity); // For checkbox/date
            });
            
            // Initial check in case browser auto-filled
            checkFormValidity();
        });
    </script>

        body {
            background-color: #fbf9f9; /* surface */

<body class="text-primary antialiased min-h-screen flex flex-col relative pb-32">
<!-- Main Canvas -->
<main class="flex-grow w-full px-margin-mobile pt-12 max-w-lg mx-auto">
<!-- Header -->
<header class="mb-12">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">

            </h1>
</header>
<!-- Quote Items -->
<div class="flex flex-col gap-8">
<!-- Item 1 -->
<div class="border-b border-primary pb-6 relative group">
<div class="flex justify-between items-baseline mb-3">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary">
                        Coverage
                    </span>
<a class="font-label-sm text-label-sm uppercase tracking-widest text-primary hover:text-secondary transition-colors underline decoration-1 underline-offset-4" href="#">
                        EDIT
                    </a>
</div>
<h2 class="font-headline-md text-headline-md text-primary mb-4 leading-tight">
                    Full Day Editorial
                </h2>
<div class="flex justify-between items-end font-body-md text-body-md text-primary">
<span class="text-secondary">1 x $4,500</span>
<span class="font-semibold">$4,500</span>
</div>
</div>
<!-- Item 2 -->
<div class="border-b border-primary pb-6 relative group">
<div class="flex justify-between items-baseline mb-3">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary">
                        Add-On
                    </span>
<a class="font-label-sm text-label-sm uppercase tracking-widest text-primary hover:text-secondary transition-colors underline decoration-1 underline-offset-4" href="#">
                        EDIT
                    </a>
</div>
<h2 class="font-headline-md text-headline-md text-primary mb-4 leading-tight">
                    Second Photographer
                </h2>
<div class="flex justify-between items-end font-body-md text-body-md text-primary">
<span class="text-secondary">1 x $800</span>
<span class="font-semibold">$800</span>
</div>
</div>
<!-- Item 3 -->
<div class="border-b border-primary pb-6 relative group">
<div class="flex justify-between items-baseline mb-3">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary">
                        Heirloom
                    </span>
<a class="font-label-sm text-label-sm uppercase tracking-widest text-primary hover:text-secondary transition-colors underline decoration-1 underline-offset-4" href="#">
                        EDIT
                    </a>
</div>
<h2 class="font-headline-md text-headline-md text-primary mb-4 leading-tight">
                    Fine Art Linen Album
                </h2>
<div class="flex justify-between items-end font-body-md text-body-md text-primary">
<span class="text-secondary">1 x $1,200</span>
<span class="font-semibold">$1,200</span>
</div>
</div>
</div>
<!-- Total Section -->
<div class="mt-16 pt-8 border-t-2 border-primary">
<div class="flex flex-col items-start">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary mb-2">
                    ESTIMATED QUOTE
                </span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">
                    $6,500

</div>
<p class="mt-4 font-body-md text-body-md text-secondary">

</button>

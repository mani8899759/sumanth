<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Access — Sumanth Photography</title>
  <meta name="robots" content="noindex, nofollow" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--border-color);
      background: var(--bg);
      padding: 48px 40px;
    }

    .login-header {
      margin-bottom: 36px;
      text-align: left;
    }

    .login-brand {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .login-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-field label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-primary);
      font-weight: 500;
    }

    .form-field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-color);
      padding: 14px 16px;
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      border-radius: 0;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .form-field input:focus {
      background: #eae9e4;
    }

    .btn-signin {
      background: var(--text-primary);
      color: var(--bg);
      border: 1px solid var(--text-primary);
      padding: 16px 24px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .btn-signin:hover {
      background: transparent;
      color: var(--text-primary);
    }

    .login-error {
      display: none;
      border: 1px solid var(--border-color);
      background: #fbebeb;
      color: #141212;
      padding: 14px;
      font-size: 13px;
      margin-bottom: 20px;
      font-family: var(--font-sans);
    }

    .login-footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--border-light);
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-brand">SUMANTH<br />PHOTOGRAPHY</h1>
        <span class="login-badge">ADMIN ACCESS &middot; PRIVATE WORKSPACE</span>
      </div>

      <div id="login-error-box" class="login-error" role="alert"></div>

      <form id="admin-login-form" class="login-form">
        <div class="form-field">
          <label for="admin-email">EMAIL</label>
          <input type="email" id="admin-email" name="email" required autocomplete="username" placeholder="maneekanta0@gmail.com" />
        </div>

        <div class="form-field">
          <label for="admin-password">PASSWORD</label>
          <input type="password" id="admin-password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>

        <button type="submit" id="btn-login-submit" class="btn-signin">
          <span id="login-btn-label">SIGN IN &rarr;</span>
        </button>
      </form>

      <div class="login-footer">
        <span>&copy; 2026 SUMANTH PHOTOGRAPHY</span>
        <a href="../index.html" style="text-decoration:underline;">&larr; PUBLIC SITE</a>
      </div>
    </div>
  </div>

  <!-- SUPABASE CLIENT & CORE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-core.js"></script>
  <script>
    const loginForm = document.getElementById('admin-login-form');
    const emailInput = document.getElementById('admin-email');
    const passwordInput = document.getElementById('admin-password');
    const submitBtn = document.getElementById('btn-login-submit');
    const btnLabel = document.getElementById('login-btn-label');
    const errorBox = document.getElementById('login-error-box');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        errorBox.textContent = 'Please enter both your admin email and password.';
        errorBox.style.display = 'block';
        return;
      }

      try {
        submitBtn.disabled = true;
        btnLabel.textContent = 'VERIFYING CREDENTIALS...';

        await window.SumanthDB.signInAdmin(email, password);

        btnLabel.textContent = 'ACCESS GRANTED ✓';
        setTimeout(() => {
          window.location.replace('index.html');
        }, 300);

      } catch (err) {
        submitBtn.disabled = false;
        btnLabel.textContent = 'SIGN IN →';
        errorBox.textContent = err.message || 'Invalid admin credentials.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>

</html>
